name: Verify profile

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The whole history and the tags, for the step release-check of just check.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Install node, which the profile and its tests need
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Keep the build of jlog
        id: jlog
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/jlog
          key: jlog-v0.1.1-${{ runner.os }}
      - name: Install jlog v0.1.1, which the jnterfaces installer needs
        if: steps.jlog.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/rahuldave/jlog --tag v0.1.1
      - name: Get jnterfaces and nossaifd, which the live lab installs, at pinned commits
        shell: bash
        run: |
          set -euo pipefail
          packages="$RUNNER_TEMP/packages"
          get() {
            git clone --quiet "https://github.com/rahuldave/$1.git" "$packages/$1"
            git -C "$packages/$1" checkout --quiet "$2"
          }
          get jnterfaces 338ca39105397177d51fdc1bbb555b80f2bc22de
          get nossaifd 7ab9e940bfdfad994008c1b00234572547ceaf9a
          echo "SKILL_PACKAGES_DIR=$packages" >> "$GITHUB_ENV"
          echo "NOSSAIFD_CHECK=$packages/nossaifd/check.py" >> "$GITHUB_ENV"
      - name: Run every check of the repository
        run: just check

  # On a push to main, after the job verify passed, tag the next release with just release. No agent runs here.
  release:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # One release at a time. A run on an older commit after a newer release prints no release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Name the author of the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag the release
        run: just release
